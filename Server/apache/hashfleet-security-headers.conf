# Administrator handoff only. NOT deployed by the website installer.
# Include inside hashfleet.app's virtual host, never at server/account scope.
# This changes response headers only. Keep every existing access/WAF rule.
# Clear the other Apache header table to avoid conflicting duplicate values.
Header onsuccess unset X-Content-Type-Options
Header always set X-Content-Type-Options "nosniff"
Header onsuccess unset X-Frame-Options
Header always set X-Frame-Options "DENY"
Header onsuccess unset Referrer-Policy
Header always set Referrer-Policy "no-referrer"
Header onsuccess unset Permissions-Policy
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header onsuccess unset Content-Security-Policy
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
