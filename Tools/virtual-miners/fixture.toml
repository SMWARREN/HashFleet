# Hammer ThorOS API fixtures. ThorOS is closed source and ships only OTA app images, so these
# profiles cannot boot under esp-emu. The route/field schema mirrors the pinned vendor images.
[[miner]]
name = "thor-x1"
board = "thor-x1"
backend = "api-fixture"
http_port = 18283
scenario = "normal"

[[miner]]
name = "thor-p2"
board = "thor-p2"
backend = "api-fixture"
http_port = 18284
scenario = "normal"
