name: Swift validation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Runner access check or explicitly requested app validation"
        type: choice
        required: true
        default: runner-check
        options:
          - runner-check
          - validation
permissions:
  contents: read
jobs:
  runner-check:
    if: ${{ inputs.mode == 'runner-check' }}
    runs-on: macos-15
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Confirm runner access without running application code
        run: printf '%s\n' 'Runner access confirmed. No checkout, builds, app tests, or signing secrets used.'
  test-and-build:
    if: ${{ inputs.mode == 'validation' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test API core
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS simulator app
        run: xcodebuild -project HashFleet.xcodeproj -scheme HashFleet -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Native state, safety, and UI tests
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep 'iPhone' | head -n 1 | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          test -n "$DEVICE_ID"
          xcodebuild -project HashFleet.xcodeproj -scheme HashFleet -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
