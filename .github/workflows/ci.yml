name: HashFleet CI

# Contribution CI. Pull requests run with a read-only token and no secrets. This workflow
# deliberately never uses pull_request_target. Pushes to main re-run the same checks after a
# reviewed merge, and the release workflow may gate on a successful push-to-main run.
#
# Branch protection should require exactly one status check: "CI required".
#
# Match the working local Xcode 27.2 SDK, including SwiftUI toolbar APIs.
# Standard arm64 xcode-27 is a preview image, not the paid xlarge runner.
# Source: https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "runner-check confirms runner access only. simulator-ui-tests is the heavy manual opt-in suite."
        type: choice
        required: true
        default: runner-check
        options:
          - runner-check
          - simulator-ui-tests

permissions:
  contents: read

concurrency:
  group: hashfleet-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  # Supersede stale pull request runs only. Each main push has its own group (its commit SHA),
  # so a newer push can never cancel or replace a pending run that release gating may need.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  repo-checks:
    name: Repository checks
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax, source contracts and offline PHP tests
        run: Scripts/ci/repo-checks.sh

  website:
    name: Website tests and build
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # vitest 5 requires Node ^22.12, ^24 or >=26.
          node-version: 24
      - run: npm ci
      - name: Website tests with genuine V8 coverage
        run: npm run test:coverage -- --coverage.reportsDirectory="$RUNNER_TEMP/hashfleet-website-coverage"
      - run: npm run build
      - name: Isolated hosting installer contracts
        working-directory: .
        env:
          JCODE_SCRATCH_DIR: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          export HASHFLEET_TEST_PHP="$(command -v php)"
          test -n "$HASHFLEET_TEST_PHP"
          python3 -B Server/tests/deployment_test.py
      - name: Upload website LCOV coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-coverage
          path: ${{ runner.temp }}/hashfleet-website-coverage/lcov.info
          if-no-files-found: ignore

  swiftlint:
    name: SwiftLint
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify SwiftLint 0.65.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOOL_DIR="$RUNNER_TEMP/hashfleet-swiftlint"
          mkdir -m 700 "$TOOL_DIR"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --retry-max-time 240 --connect-timeout 20 --max-time 120 \
            --header 'Accept: application/octet-stream' \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/realm/SwiftLint/releases/assets/524187565 \
            --output "$TOOL_DIR/swiftlint.zip"
          printf '%s  %s\n' c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0 "$TOOL_DIR/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$TOOL_DIR/swiftlint.zip" -d "$TOOL_DIR/bin"
          test "$("$TOOL_DIR/bin/swiftlint" version)" = 0.65.1
      - name: Enforce existing SwiftLint configuration
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          "$RUNNER_TEMP/hashfleet-swiftlint/bin/swiftlint" lint \
            --config .swiftlint.yml --strict --no-cache --reporter github-actions-logging
          "$RUNNER_TEMP/hashfleet-swiftlint/bin/swiftlint" lint \
            --config .swiftlint.yml --strict --no-cache --reporter json > "$RUNNER_TEMP/coverage/swiftlint.json"
      - name: Upload SwiftLint findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftlint-findings
          path: ${{ runner.temp }}/coverage/swiftlint.json
          if-no-files-found: ignore

  swift-package:
    name: Swift package tests and CLI build
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Test HashFleetCore and HashFleetWatchCore with coverage
        run: |
          swift test --enable-code-coverage
          mkdir -p "$RUNNER_TEMP/coverage"
          bin="$(swift build --show-bin-path)"
          profile="$(find .build -name "default.profdata" | head -n 1)"
          binary="$(find "$bin" -name "HashFleetCorePackageTests" -o -name "HashFleetCoreTests" | head -n 1)"
          if [ -n "$profile" ] && [ -n "$binary" ]; then
            xcrun llvm-cov export --format=lcov -instr-profile "$profile" "$binary" > "$RUNNER_TEMP/coverage/package.lcov"
            python3 Tools/swiftpm_coverage.py "$RUNNER_TEMP/coverage/package.lcov" "$RUNNER_TEMP/coverage/swift-package-coverage.xml" --root "$GITHUB_WORKSPACE"
          fi
      - name: Build the hashfleet CLI and run its offline help
        run: |
          swift build --product hashfleet
          "$(swift build --show-bin-path)/hashfleet" --help >/dev/null
      - name: Upload Swift package coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-package-coverage
          path: ${{ runner.temp }}/coverage/swift-package-coverage.xml
          if-no-files-found: ignore

  mac-app-build:
    name: Unsigned macOS app build and test
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Build and test HashFleetMac without signing
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          xcodebuild \
            -project HashFleet.xcodeproj \
            -scheme HashFleetMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/derived-mac" \
            -resultBundlePath "$RUNNER_TEMP/coverage/mac.xcresult" \
            -enableCodeCoverage YES \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            test
          python3 Tools/xccov_to_generic.py "$RUNNER_TEMP/coverage/mac.xcresult" "$RUNNER_TEMP/coverage/mac-coverage.xml" --root "$GITHUB_WORKSPACE"
      - name: Upload Mac test and coverage bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-test-bundle
          path: ${{ runner.temp }}/coverage/mac-coverage.xml
          if-no-files-found: ignore

  ios-app-build:
    name: Unsigned iOS simulator app build
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: xcodebuild -version
      - name: Build HashFleet (with widgets, notification service and Watch app) without signing
        run: |
          xcodebuild \
            -project HashFleet.xcodeproj \
            -scheme HashFleet \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived-ios" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            build

  sonar:
    name: SonarQube analysis
    if: ${{ github.event_name != 'workflow_dispatch' }}
    needs: [repo-checks, website, swiftlint, swift-package, mac-app-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install swift-sonar-kit and coverage
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install coverage pillow git+https://github.com/SMWARREN/swift-sonar-kit.git
      - name: Download coverage and test artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build/coverage
          merge-multiple: true
      - name: Run Python unit tests with coverage
        run: |
          export PYTHONPATH="Scripts/release${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m coverage run --branch --source=Tools,Scripts,Server/tools,website/Tools '--omit=Tools/test_*,Scripts/tests/test_*,Scripts/release/test_*,website/Tools/test_*' -m unittest \
            Scripts/release/test_release.py \
            Scripts/tests/test_package_hashfleet_mac.py \
            Scripts/tests/test_native_add_miner_completion.py \
            Scripts/tests/test_crypto_support.py \
            website/Tools/test_capture_dashboard.py \
            website/Tools/test_capture_cli_fixtures.py \
            website/Tools/test_capture_cli_dashboard_extra.py \
            website/Tools/test_capture_cli_dashboard_flow.py \
            Scripts/release/test_release_extra.py \
            Scripts/tests/test_build_bundle.py \
            Scripts/tests/test_sonar_scan_ci.py \
            Scripts/tests/test_generate_cli_logo.py \
            website/Tools/test_prepare_captures.py \
            Tools.test_sonar_scope \
            Tools.test_xccov_to_generic \
            Tools.test_swiftpm_coverage \
            Tools.test_layout_guardrails \
            Tools.test_sonar_project_recipe \
            Tools.test_sonar_scan \
            Tools.test_verify_local_push_removal \
            Tools.test_sonar_swift_preflight \
            Tools.test_verify_expansion_acceptance \
            Tools.test_native_mac_smoke \
            Tools.test_native_mac_tour_smoke \
            Tools.test_generate_hash_fleet_brand_loop \
            Tools.test_import_3dicon_webp \
            Tools.test_prepare_hash_fleet_wan_workflow \
            Tools.test_art_tooling_coverage
          python3 -m coverage xml -o build/coverage/python-coverage.xml
      - name: Run offline PHP server tests with coverage
        run: |
          mkdir -p build/coverage
          docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -v "$PWD":/w -w /w php:8.3-cli bash -ec '
            pecl install xdebug
            docker-php-ext-enable xdebug
            XDEBUG_MODE=coverage php Server/tests/coverage.php build/coverage/php-coverage.xml
            chown "$HOST_UID:$HOST_GID" build/coverage/php-coverage.xml
          '
          test -s build/coverage/php-coverage.xml
      - name: Run SonarQube analysis in Docker with coverage
        run: |
          python3 Scripts/ci/sonar-scan-ci.py

  # Stable aggregate for branch protection. It fails on any failed, cancelled or skipped
  # prerequisite, so the individual job names above can change without editing repository settings.
  ci-required:
    name: CI required
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    needs: [repo-checks, website, swiftlint, swift-package, mac-app-build, ios-app-build, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Prerequisite results: $RESULTS"
          read -r -a prerequisites <<< "$RESULTS"
          # Keep this count aligned with the seven explicit jobs in needs above.
          [ "${#prerequisites[@]}" -eq 7 ] || { echo "Missing prerequisite results." >&2; exit 1; }
          for result in "${prerequisites[@]}"; do
            [ "$result" = success ] || { echo "A prerequisite did not succeed." >&2; exit 1; }
          done

  runner-check:
    name: Runner access check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'runner-check' }}
    runs-on: xcode-27
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Confirm runner access without running application code
        run: |
          printf '%s\n' 'Runner access confirmed. No checkout, builds, app tests, or signing secrets used.'
          xcodebuild -version

  simulator-ui-tests:
    name: Simulator UI tests (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'simulator-ui-tests' }}
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native state, safety, and UI tests on an iPhone simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for runtime,devices in sorted(d["devices"].items(), reverse=True) if "iOS" in runtime for x in devices if x.get("isAvailable") and x["name"].startswith("iPhone")), ""))')
          test -n "$DEVICE_ID"
          xcodebuild \
            -project HashFleet.xcodeproj \
            -scheme HashFleet \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/derived-ui" \
            -onlyUsePackageVersionsFromResolvedFile \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test
