name: Bug report
description: Report a reproducible HashFleet issue without private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include wallet addresses, passwords, private IP inventories, raw miner logs, or signing credentials. Report security vulnerabilities privately using SECURITY.md."
  - type: input
    id: version
    attributes:
      label: App or CLI version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      placeholder: "macOS, iOS, watchOS, or CLI"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Prefer demo data or an isolated fixture. Do not change hardware settings to reproduce a report.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
