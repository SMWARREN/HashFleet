# macOS Apache acceptance fixture. Never use this as system/server production config.
# Set HASHFLEET_ACCEPTANCE_ROOT, HASHFLEET_ACCEPTANCE_USER, and HASHFLEET_ACCEPTANCE_GROUP.
ServerRoot "${HASHFLEET_ACCEPTANCE_ROOT}"
Listen 127.0.0.1:4175
Listen 127.0.0.1:4176
ServerName 127.0.0.1
PidFile "httpd.pid"
DefaultRuntimeDir "${HASHFLEET_ACCEPTANCE_ROOT}"
LoadModule mpm_prefork_module /usr/libexec/apache2/mod_mpm_prefork.so
LoadModule unixd_module /usr/libexec/apache2/mod_unixd.so
LoadModule authz_core_module /usr/libexec/apache2/mod_authz_core.so
LoadModule headers_module /usr/libexec/apache2/mod_headers.so
LoadModule dir_module /usr/libexec/apache2/mod_dir.so
LoadModule mime_module /usr/libexec/apache2/mod_mime.so
LoadModule log_config_module /usr/libexec/apache2/mod_log_config.so
LoadModule autoindex_module /usr/libexec/apache2/mod_autoindex.so
User ${HASHFLEET_ACCEPTANCE_USER}
Group ${HASHFLEET_ACCEPTANCE_GROUP}
ErrorLog "error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "access.log" common
TypesConfig /etc/apache2/mime.types
ServerTokens Prod
ServerSignature Off
DocumentRoot "${HASHFLEET_ACCEPTANCE_ROOT}/site"
<Directory />
  AllowOverride None
  Require all denied
</Directory>
<Directory "${HASHFLEET_ACCEPTANCE_ROOT}/site">
  Options Indexes FollowSymLinks
  AllowOverride All
  Require all granted
</Directory>
<Directory "${HASHFLEET_ACCEPTANCE_ROOT}/previous">
  Options Indexes FollowSymLinks
  AllowOverride All
  Require all granted
</Directory>
<FilesMatch "^\\.ht">
  Require all denied
</FilesMatch>
<VirtualHost 127.0.0.1:4176>
  DocumentRoot "${HASHFLEET_ACCEPTANCE_ROOT}/previous"
</VirtualHost>
