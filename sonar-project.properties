# SonarQube analysis for application, server, website and repository tooling sources.
#
# SonarQube Community Edition does not ship a Swift analyser, so the project uses the free
# insideapp-fr/sonar-apple plugin, which adds the `swift` language, complexity and size metrics,
# and imports SwiftLint findings as issues. Install the plugin jar into the server's
# extensions/plugins directory, then run `Tools/sonar-scan.sh`.
sonar.projectKey=hashfleet
sonar.projectName=Hash Fleet
sonar.projectVersion=0.1.0

sonar.sources=App,Shared,Sources,Widgets,MacMenuBar,MacApp,NotificationService,WatchApp,WatchWidgets,Server/private,Server/public,Server/tools,website/src,website/Tools,Tools,Scripts
sonar.tests=AppTests,MacAppTests,Tests,UITests,WatchUITests,Server/tests,Tools,Scripts/tests,Scripts/release,website/src,website/Tools
# Keep test patterns path-scoped. A blanket **/*.swift pattern also excludes
# all production Swift files from Sonar's source analysis.
sonar.test.inclusions=AppTests/**/*.swift,MacAppTests/**/*.swift,Tests/**/*.swift,UITests/**/*.swift,WatchUITests/**/*.swift,Server/tests/**,Tools/test_*.py,Scripts/tests/test_*.py,Scripts/release/test_*.py,website/Tools/test_*.py,website/src/**/*.test.ts,website/src/**/*.test.tsx,website/src/**/*.test.js,website/Tools/*.node-test.mjs,website/Tools/browser-acceptance.js,website/Tools/native-parity-acceptance.js,website/Tools/navigation-regression.js,website/Tools/privacy-permalink-acceptance.js,website/Tools/public-contact-acceptance.js,website/Tools/route-acceptance.js,website/Tools/support-acceptance.js,website/Tools/watch-acceptance.js
# Tools contains production utilities and actual unittest modules. Classify only
# those named test modules as tests, keeping every production utility in scope.
# Website unit tests and the eight assertion-only browser payloads are test code.
# Their runners, result parser, capture tooling and all application components remain
# production sources. No test execution or coverage result is implied by classification.

sonar.sourceEncoding=UTF-8
# Repository tooling is executed and regression-tested with local Python 3.14.
sonar.python.version=3.14

# Generated, vendored and documentation trees are not ours to fix.
sonar.exclusions=**/.build/**,**/build/**,**/DerivedData/**,docs/**,**/*.generated.swift
