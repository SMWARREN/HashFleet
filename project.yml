name: HashFleet
options:
  bundleIdPrefix: app.hashfleet
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "26.5"
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
  DebugNoAppPush: debug
  ReleaseNoAppPush: release
packages:
  HashFleetCore:
    path: .
  LucideSwift:
    url: https://github.com/ajaxjiang96/lucide-swift
    from: 0.9.3
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
  DebugNoAppPush: Signing.xcconfig
  ReleaseNoAppPush: Signing.xcconfig
schemes:
  HashFleetWatch:
    build:
      targets:
        HashFleetWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HashFleetWatchUITests
      gatherCoverageData: true
    archive:
      config: Release
  HashFleetMac:
    build:
      targets:
        HashFleetMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HashFleetMacTests
      gatherCoverageData: true
    profile:
      config: Release
    archive:
      config: Release
  HashFleetNoAppPush:
    build:
      targets:
        HashFleet: all
    run:
      config: DebugNoAppPush
    test:
      config: DebugNoAppPush
      targets:
        - HashFleetTests
        - HashFleetUITests
      gatherCoverageData: true
    profile:
      config: ReleaseNoAppPush
    analyze:
      config: DebugNoAppPush
    archive:
      config: ReleaseNoAppPush
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      APS_ENVIRONMENT: development
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    Release:
      APS_ENVIRONMENT: production
    DebugNoAppPush:
      APS_ENVIRONMENT: development
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
    ReleaseNoAppPush:
      APS_ENVIRONMENT: production
targets:
  HashFleetMac:
    type: application
    productName: Hash Fleet
    platform: macOS
    sources:
      - path: MacApp
      - path: App
        excludes:
          - HashFleetApp.swift
          - HashFleetApp+RemotePush.swift
          - Store/FleetBackgroundRefresh.swift
          - Resources/Info.plist
          - Resources/LaunchScreen.storyboard
          - Resources/HashFleet.entitlements
          - Resources/HashFleetNoAppPush.entitlements
      - path: Shared
        excludes:
          - FleetActivityAttributes.swift
    dependencies:
      - package: HashFleetCore
      - package: LucideSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet.mac
        PRODUCT_NAME: Hash Fleet
        PRODUCT_MODULE_NAME: HashFleetMac
        # Direct-distribution Mac app only. Remove this flag for any Mac App Store target.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HASHFLEET_DIRECT_DISTRIBUTION"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "12"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MacApp/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacApp/Resources/HashFleet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: MacAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: FleetMacAccent
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: macosx
  HashFleetMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacAppTests
      - path: AppTests/FleetDeviceCopyTests.swift
      - path: AppTests/FleetMinerDetailGridTests.swift
      - path: AppTests/FleetHistoryRenderingTests.swift
      - path: AppTests/FleetRoundedSurfaceSpacingTests.swift
      - path: AppTests/MinerOperationAuthorizationTests.swift
      - path: AppTests/FleetStartupMaintenanceTests.swift
      - path: AppTests/MinerTimedFreshnessTests.swift
      - path: AppTests/DeduplicateDevicesByMACFailureTests.swift
      - path: AppTests/DeduplicateDevicesByMACFailureTests+Transfers.swift
      - path: AppTests/FleetBackgroundPublicationTests.swift
    dependencies:
      - target: HashFleetMac
      - package: HashFleetCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hash Fleet.app/Contents/MacOS/Hash Fleet"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HashFleetMenuBar:
    type: application
    platform: macOS
    sources:
      - path: MacMenuBar
      - path: Shared/FleetGlance.swift
    dependencies:
      - package: HashFleetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet.menubar
        PRODUCT_NAME: Hash Fleet Menu Bar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "12"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hash Fleet Menu Bar
        CODE_SIGN_ENTITLEMENTS: MacMenuBar/Resources/HashFleetMenuBar.entitlements
        CODE_SIGN_STYLE: Automatic
  HashFleet:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: HashFleetCore
      - package: HashFleetCore
        product: HashFleetWatchCore
      - package: LucideSwift
      - target: HashFleetWidgets
        embed: true
      - target: HashFleetNotificationService
        embed: true
      - target: HashFleetWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "12"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Resources/HashFleet.entitlements
      configs:
        DebugNoAppPush:
          CODE_SIGN_ENTITLEMENTS: App/Resources/HashFleetNoAppPush.entitlements
        ReleaseNoAppPush:
          CODE_SIGN_ENTITLEMENTS: App/Resources/HashFleetNoAppPush.entitlements
    scheme:
      gatherCoverageData: true
      testTargets:
        - HashFleetTests
        - HashFleetUITests
  HashFleetWatch:
    type: application
    productName: Hash Fleet Watch
    platform: watchOS
    sources:
      - path: WatchApp
    dependencies:
      - package: HashFleetCore
        product: HashFleetWatchCore
      - target: HashFleetWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet.watchkitapp
        PRODUCT_NAME: Hash Fleet Watch
        PRODUCT_MODULE_NAME: HashFleetWatch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "15"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WatchApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  HashFleetWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet.watchkitapp.widgets
        PRODUCT_NAME: HashFleetWatchWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "15"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WatchWidgets/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  HashFleetWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: HashFleetWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet.watchkitapp.uitests
  HashFleetWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: HashFleetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "12"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Resources/HashFleetWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  HashFleetNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    dependencies:
      - package: HashFleetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet.notification-service
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "12"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NotificationService/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/Resources/NotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  # Compile the exact extension view sources for host-side rendering tests.
  HashFleetWidgetTestSupport:
    type: framework
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - HashFleetWidgets.swift
          - Resources
      - path: Shared
    dependencies:
      - package: HashFleetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet.widget-test-support
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  HashFleetNotificationTestSupport:
    type: framework
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - Resources
    dependencies:
      - package: HashFleetCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hashfleet.notification-test-support
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  HashFleetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    resources:
      - path: AppTests/Fixtures/animated-webp-2frames.webp
    dependencies:
      - target: HashFleet
      - target: HashFleetWidgetTestSupport
      - target: HashFleetNotificationTestSupport
      - package: HashFleetCore
      - package: HashFleetCore
        product: HashFleetWatchCore
      - package: GRDB.swift
        product: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HashFleetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: HashFleet
      - package: HashFleetCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
